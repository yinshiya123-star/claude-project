<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>中英字幕生成器</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>中英字幕生成器</h1>
    <p class="sub">上传音频 / 视频 → Whisper 语音识别（支持多国语言）→ DeepSeek 翻译 / 校对 → 中英双语或中文字幕，可导出带字幕 MP3、烧录进视频</p>
  </header>

  <main>
    <section class="card" id="upload-card">
      <label id="dropzone" for="file-input">
        <input id="file-input" type="file" accept=".mp3,.mp4,.m4a,.wav,.flac,.ogg,.aac,.webm,.mov,.mkv,audio/*,video/*" hidden />
        <div class="drop-icon" aria-hidden="true">⬆</div>
        <div id="drop-text">点击或拖拽 MP3 / MP4 文件到这里</div>
        <div class="hint">支持 mp3、mp4、m4a、wav、mov、mkv 等格式</div>
      </label>

      <div class="options">
        <label>
          输出字幕
          <select id="target">
            <option value="bilingual">中英双语（中文 / 外语 → 双语）</option>
            <option value="zh">仅中文（中文 → 中文字幕）</option>
          </select>
        </label>
        <label>
          原始语言
          <select id="language">
            <option value="">自动检测（支持多国语言、混合语言）</option>
            <option value="zh">中文</option>
            <option value="en">英语</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
            <option value="fr">法语</option>
            <option value="de">德语</option>
            <option value="es">西班牙语</option>
            <option value="ru">俄语</option>
            <option value="pt">葡萄牙语</option>
            <option value="it">意大利语</option>
            <option value="ar">阿拉伯语</option>
            <option value="th">泰语</option>
            <option value="vi">越南语</option>
            <option value="id">印尼语</option>
            <option value="ms">马来语</option>
            <option value="hi">印地语</option>
            <option value="tr">土耳其语</option>
            <option value="nl">荷兰语</option>
            <option value="pl">波兰语</option>
            <option value="uk">乌克兰语</option>
          </select>
        </label>
        <label class="grow">
          <span id="key-label">DeepSeek API Key</span>
          <input id="api-key" type="password" placeholder="sk-...（服务端已配置时可留空）" autocomplete="off" />
        </label>
      </div>

      <button id="start-btn" disabled>开始生成字幕</button>
      <p id="upload-error" class="error" hidden></p>
    </section>

    <section class="card" id="progress-card" hidden>
      <div class="progress-head">
        <span id="stage">排队中</span>
        <span id="percent">0%</span>
      </div>
      <div class="bar"><div id="bar-fill"></div></div>
      <p id="job-error" class="error" hidden></p>
    </section>

    <section class="card" id="result-card" hidden>
      <div class="player-wrap">
        <video id="player" controls playsinline></video>
      </div>

      <div class="toolbar">
        <div class="seg-toggle" id="mode-toggle" role="group" aria-label="字幕显示"></div>
      </div>

      <div class="downloads">
        <div class="dl-title">下载 <small>（"带字幕 MP3"把字幕作为歌词写进 MP3，手机和播放器播放时可显示；视频会先转成 MP3）</small></div>
        <table id="dl-table"></table>
      </div>

      <div class="burn">
        <div class="dl-title">烧录字幕到视频 <small>（把字幕直接画进画面，任何播放器、视频网站都能看到；纯音频会生成黑底视频）</small></div>
        <div class="burn-row">
          <select id="burn-mode"></select>
          <button id="burn-btn" class="secondary">开始烧录</button>
          <a id="burn-download" hidden>下载烧录好的视频</a>
        </div>
        <div id="burn-progress" hidden>
          <div class="progress-head"><span id="burn-stage">烧录中</span><span id="burn-percent">0%</span></div>
          <div class="bar"><div id="burn-fill"></div></div>
        </div>
        <p id="burn-error" class="error" hidden></p>
      </div>

      <div class="table-head">
        <span>字幕列表 <small id="seg-count"></small>（点击时间跳转，可直接编辑文本）</span>
        <button id="save-btn" class="secondary" disabled>保存修改</button>
      </div>
      <ol id="segments"></ol>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
