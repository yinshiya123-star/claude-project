<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>中英字幕生成器</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>中英字幕生成器</h1>
    <p class="sub">上传音频 / 视频 → Whisper 语音识别 → DeepSeek 翻译 → 中英双语字幕</p>
  </header>

  <main>
    <section class="card" id="upload-card">
      <label id="dropzone" for="file-input">
        <input id="file-input" type="file" accept=".mp3,.mp4,.m4a,.wav,.flac,.ogg,.aac,.webm,.mov,.mkv,audio/*,video/*" hidden />
        <div class="drop-icon" aria-hidden="true">⬆</div>
        <div id="drop-text">点击或拖拽 MP3 / MP4 文件到这里</div>
        <div class="hint">支持 mp3、mp4、m4a、wav、mov、mkv 等格式</div>
      </label>

      <div class="options">
        <label>
          原始语言
          <select id="language">
            <option value="">自动检测</option>
            <option value="zh">中文</option>
            <option value="en">英文</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
          </select>
        </label>
        <label class="grow">
          DeepSeek API Key
          <input id="api-key" type="password" placeholder="sk-...（服务端已配置时可留空）" autocomplete="off" />
        </label>
      </div>

      <button id="start-btn" disabled>开始生成字幕</button>
      <p id="upload-error" class="error" hidden></p>
    </section>

    <section class="card" id="progress-card" hidden>
      <div class="progress-head">
        <span id="stage">排队中</span>
        <span id="percent">0%</span>
      </div>
      <div class="bar"><div id="bar-fill"></div></div>
      <p id="job-error" class="error" hidden></p>
    </section>

    <section class="card" id="result-card" hidden>
      <div class="player-wrap">
        <video id="player" controls playsinline></video>
      </div>

      <div class="toolbar">
        <div class="seg-toggle" role="group" aria-label="字幕显示">
          <button data-mode="bilingual" class="active">双语</button>
          <button data-mode="zh">中文</button>
          <button data-mode="en">英文</button>
        </div>
        <div class="downloads">
          <span>下载：</span>
          <a data-dl="bilingual" data-fmt="srt">双语 SRT</a>
          <a data-dl="zh" data-fmt="srt">中文 SRT</a>
          <a data-dl="en" data-fmt="srt">英文 SRT</a>
          <a data-dl="bilingual" data-fmt="vtt">双语 VTT</a>
        </div>
      </div>

      <div class="table-head">
        <span>字幕列表 <small id="seg-count"></small>（点击时间跳转，可直接编辑文本）</span>
        <button id="save-btn" class="secondary" disabled>保存修改</button>
      </div>
      <ol id="segments"></ol>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
