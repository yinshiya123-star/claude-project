# 推送 skgram/ 下的改动或手动运行：构建全平台安装包（APK、EXE/MSI、DMG、AppImage/DEB）并上传为 Artifacts；
# 然后发布到 Release skgram-v<版本号>（版本号取自 skgram/build.gradle.kts；已存在就替换其中的文件）。
# 要发布新版本：改 skgramVersion（和 skgramVersionCode）后推送。
name: SKGram

on:
  workflow_dispatch:
  push:
    paths: ["skgram/**", ".github/workflows/skgram*.yml"]

permissions:
  contents: write

concurrency:
  group: skgram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/skgram-build.yml
    secrets: inherit
    with:
      release: true
