# 构建 SKGram 安卓 APK。
# 推送 skgram/ 下的改动或手动运行：APK 作为 Artifacts 上传；
# 手动运行时填写版本号（例如 skgram-v1.0.0）：同时创建该标签并发布到 Releases。
# 可选仓库 Secrets：
#   TG_API_ID / TG_API_HASH      预置 Telegram API 凭据（不填则首次启动时在应用里输入）
#   SKGRAM_KEYSTORE_BASE64       release 签名密钥库（base64），配合下面三个
#   SKGRAM_KEYSTORE_PASSWORD / SKGRAM_KEY_ALIAS / SKGRAM_KEY_PASSWORD
#   不配置签名时使用 debug 密钥签名，可以直接安装。
name: SKGram APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（会创建同名标签），例如 skgram-v1.0.0；留空则只上传 Artifacts"
        required: false
        default: ""
  push:
    paths: ["skgram/**", ".github/workflows/skgram.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skgram
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SKGRAM_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/skgram.jks"
          echo "SKGRAM_KEYSTORE=$RUNNER_TEMP/skgram.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          SKGRAM_KEYSTORE_PASSWORD: ${{ secrets.SKGRAM_KEYSTORE_PASSWORD }}
          SKGRAM_KEY_ALIAS: ${{ secrets.SKGRAM_KEY_ALIAS }}
          SKGRAM_KEY_PASSWORD: ${{ secrets.SKGRAM_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f" | sed -e 's/^app-/SKGram-/' -e 's/-release//')
            cp "$f" "dist/$n"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: SKGram-apk
          path: skgram/dist/*.apk

      - name: Publish release
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$VERSION" dist/*.apk --target "$GITHUB_SHA" --title "SKGram ${VERSION#skgram-}" --notes "SKGram Android APK。大多数手机下载 SKGram-arm64-v8a.apk；不确定就下载 SKGram-universal.apk。"
