# SKGram 全平台构建（被 skgram.yml 和 skgram-release.yml 调用）：
# Android APK、Windows EXE/MSI、macOS DMG（Apple 芯片 + Intel）、Linux AppImage/DEB。
# 可选仓库 Secrets：
#   TG_API_ID / TG_API_HASH      预置 Telegram API 凭据（只用于 Android 构建；不填则首次启动时在应用里输入）
#   SKGRAM_KEYSTORE_BASE64       Android release 签名密钥库（base64），配合下面三个
#   SKGRAM_KEYSTORE_PASSWORD / SKGRAM_KEY_ALIAS / SKGRAM_KEY_PASSWORD
#   不配置签名时 APK 用 debug 密钥签名，可以直接安装。
name: SKGram build

on:
  workflow_call:
    inputs:
      release:
        description: "Publish a GitHub release skgram-v<version> (version from skgram/build.gradle.kts) unless it already exists"
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash
    working-directory: skgram

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SKGRAM_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/skgram.jks"
          echo "SKGRAM_KEYSTORE=$RUNNER_TEMP/skgram.jks" >> "$GITHUB_ENV"
      - name: Build APKs
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          SKGRAM_KEYSTORE_PASSWORD: ${{ secrets.SKGRAM_KEYSTORE_PASSWORD }}
          SKGRAM_KEY_ALIAS: ${{ secrets.SKGRAM_KEY_ALIAS }}
          SKGRAM_KEY_PASSWORD: ${{ secrets.SKGRAM_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease
          v=$(./gradlew -q :printVersion)
          mkdir -p dist
          for f in androidApp/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -e 's/^androidApp-//' -e 's/-release\.apk$//')
            cp "$f" "dist/SKGram-$v-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        with: { name: skgram-android, path: skgram/dist/* }

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, tasks: ":desktopApp:packageExe :desktopApp:packageMsi", name: windows }
          - { os: macos-15, tasks: ":desktopApp:packageDmg", name: macos-arm64 }
          - { os: macos-15-intel, tasks: ":desktopApp:packageDmg", name: macos-x64 }
          - { os: ubuntu-latest, tasks: ":desktopApp:packageAppImage :desktopApp:packageDeb", name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq fakeroot
          curl -sSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Package
        run: ./gradlew ${{ matrix.tasks }}
      - name: Collect
        run: |
          v=$(./gradlew -q :printVersion)
          out=desktopApp/build/compose/binaries/main
          mkdir -p dist
          case "${{ matrix.name }}" in
            windows)
              cp "$out"/exe/*.exe "dist/SKGram-$v-windows-x64.exe"
              cp "$out"/msi/*.msi "dist/SKGram-$v-windows-x64.msi" ;;
            macos-arm64)
              cp "$out"/dmg/*.dmg "dist/SKGram-$v-macos-arm64.dmg" ;;
            macos-x64)
              cp "$out"/dmg/*.dmg "dist/SKGram-$v-macos-x64.dmg" ;;
            linux)
              tools/make-appimage.sh "$v" "$RUNNER_TEMP/appimagetool"
              cp desktopApp/build/appimage/*.AppImage dist/
              cp "$out"/deb/*.deb "dist/skgram_${v}_amd64.deb" ;;
          esac
          ls -la dist
      - uses: actions/upload-artifact@v4
        with: { name: "skgram-${{ matrix.name }}", path: skgram/dist/* }

  release:
    needs: [android, desktop]
    # Publish whatever built, even if one desktop platform failed.
    if: ${{ inputs.release && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: skgram/build.gradle.kts, sparse-checkout-cone-mode: false }
      - name: Version
        id: v
        run: |
          v=$(sed -n 's/^extra\["skgramVersion"\] = "\(.*\)"/\1/p' build.gradle.kts)
          echo "tag=skgram-v$v" >> "$GITHUB_OUTPUT"
          if gh release view "skgram-v$v" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release skgram-v$v already exists; bump skgramVersion to publish a new one."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.exists != 'true'
        with: { path: files, pattern: skgram-*, merge-multiple: true }
      - name: Publish release
        if: steps.v.outputs.exists != 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          ls -la files
          gh release create "$TAG" files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SKGram ${TAG#skgram-v}" --notes-file - <<'NOTES'
          ## 下载哪个？

          | 设备 | 文件 |
          |---|---|
          | 安卓手机（大多数） | `SKGram-*-android-arm64-v8a.apk` |
          | 安卓老手机 | `SKGram-*-android-armeabi-v7a.apk` |
          | 不确定的安卓设备 | `SKGram-*-android-universal.apk` |
          | Windows | `SKGram-*-windows-x64.exe`（或 `.msi`） |
          | Mac（Apple 芯片 M1/M2/M3/M4） | `SKGram-*-macos-arm64.dmg` |
          | Mac（Intel） | `SKGram-*-macos-x64.dmg` |
          | Linux | `SKGram-*-x86_64.AppImage`（或 `.deb`） |

          首次启动需要填写在 https://my.telegram.org 申请的 API ID 和 API Hash。

          macOS 版本没有 Apple 签名：第一次打开时请在「访达」里右键点 SKGram →「打开」。
          Windows 可能弹出 SmartScreen 提示：点「更多信息」→「仍要运行」。
          NOTES
